<script>
'use strict';
const API='https://icofocjkzzizlvdofcgl.supabase.co/functions/v1/leave-tracker';
const PUBLIC_KEY='sb_publishable_sVdFuNOw3wCmLt_V7NLUcw_kqq522n8';
const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SHIFTS={DAYS:'Days',TWI:'Twilight',NIGHTS:'Nights'};
const ROLES={SM:'Smile Maker',PI:'Process Instructor',SME:'SME',TRAINER:'Trainer'};
const SESSIONS=[{id:'day1',name:'Day 1',desc:'2 SM · PI backup',roles:['SM','PI'],min:2},{id:'day2',name:'Day 2',desc:'SM / PI + SME support',roles:['SM','PI','SME'],min:1},{id:'aew',name:'AEW',desc:'1 PI or SM',roles:['SM','PI'],min:1},{id:'process',name:'Process Training',desc:'If planned',roles:['SM','PI','SME'],min:0},{id:'proxy',name:'Proxy',desc:'SM · trainer cover',roles:['SM'],min:0}];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse=s=>new Date(s+'T12:00:00Z'), key=d=>d.toISOString().slice(0,10), add=(s,n)=>{const d=parse(s);d.setUTCDate(d.getUTCDate()+n);return key(d)}, today=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(x=>p.find(v=>v.type===x).value).join('-')}, sunday=s=>add(s,-parse(s).getUTCDay()), dateLabel=(s,opts={day:'numeric',month:'short'})=>parse(s).toLocaleDateString('en-GB',{...opts,timeZone:'UTC'});
function weekInfo(s){const y=parse(add(s,6)).getUTCFullYear();return {year:y,week:Math.floor((parse(s)-parse(sunday(y+'-01-01')))/604800000)+1}}
let token='';try{token=sessionStorage.getItem('lcy8-leave-session')||''}catch{}
let user=null,data=null,view='overview',weekStart=sunday(today()),month=today().slice(0,7),shift='DAYS',filterShift='',filterRole='',search='',selected=new Set(),draft=null,vetFilter='open',busy=false,toastTimer,returnFocus=null;
const demo=new URLSearchParams(location.search).has('demo');
function setToken(t){token=t;try{t?sessionStorage.setItem('lcy8-leave-session',t):sessionStorage.removeItem('lcy8-leave-session')}catch{}}
function toast(message,error=false){const t=$('#toast');t.textContent=message;t.className='toast'+(error?' error-toast':'');t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,5500)}
async function api(action,args={}){
 if(demo)return demoApi(action,args);
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':PUBLIC_KEY,'x-session-token':token},body:JSON.stringify({action,...args}),cache:'no-store',signal:AbortSignal.timeout(25000)});
 const out=await r.json();if(!out.ok){if(r.status===401&&action!=='login'){setToken('');user=null;data=null;loginScreen()}throw new Error(out.error||'Could not save this change.')}return out;
}
async function reload(){data=await api('snapshot');user=data.user;draft=null;render();}

function person(login){return data.people.find(p=>p.login===login)}
function isLeave(login,day){return data.leave.some(x=>x.login===login&&x.day===day)}

function status(p,day){return isLeave(p.login,day)?'AL':isWorking(p,day)?'W':'—'}
function brand(){return '<div class="brand"><span class="brand-mark" aria-hidden="true">L</span><div>LCY8<small>Learning team</small></div></div>'}

 $('#demo-button').onclick=()=>{location.search='?demo=1'};

function overview(){const days=Array.from({length:7},(_,i)=>add(weekStart,i));const list=activePeople();const off=list.filter(p=>isLeave(p.login,today())).length;const weekOff=data.leave.filter(x=>x.day>=weekStart&&x.day<=days[6]&&person(x.login)?.active).length;

 draw();bindFilters(draw);bindWeek();$('#record-leave').onclick=()=>{view='mine';render()};if(user.isAdmin)$('#backup').onclick=async()=>{try{const out=await api('export');download('LCY8-backup-'+today()+'.json',JSON.stringify({exportedAt:new Date().toISOString(),...out},null,2),'application/json');toast('Backup downloaded. PINs are excluded.')}catch(e){toast(e.message,true)}};

function myLeave(){if(!leavePerson)leavePerson=user.isAdmin?(activePeople()[0]?.login||''):user.login;if(!user.isAdmin)leavePerson=user.login;const first=month+'-01';const d=parse(first);const total=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();const pad=d.getUTCDay();const upcoming=data.leave.filter(x=>x.login===leavePerson&&x.day>=today()).sort((a,b)=>a.day.localeCompare(b.day));
 $('#workspace').innerHTML=`<div class="page-heading"><h1>${user.isAdmin?'Record leave':'My leave'}</h1><p class="muted">Record leave already agreed through your usual process.</p></div><div class="two-cols"><section class="panel stack">${user.isAdmin?`<label class="field">Team member<select id="leave-person">${activePeople().map(p=>`<option value="${esc(p.login)}" ${leavePerson===p.login?'selected':''}>${esc(p.login)} · ${p.role}</option>`).join('')}</select></label>`:''}<div><div class="row between calendar-title"><button class="btn icon" id="prev-month" aria-label="Previous month">‹</button><h2>${dateLabel(first,{month:'long',year:'numeric'})}</h2><button class="btn icon" id="next-month" aria-label="Next month">›</button></div><div class="calendar">${DAY.map(x=>`<div class="cal-head">${x.slice(0,2)}</div>`).join('')}${Array.from({length:pad},()=>'<div class="cal-empty"></div>').join('')}${Array.from({length:total},(_,i)=>{const day=month+'-'+String(i+1).padStart(2,'0');return `<button class="cal-day ${isLeave(leavePerson,day)?'booked':''} ${day===today()?'today':''}" data-day="${day}" aria-pressed="${selected.has(day)}" aria-label="${dateLabel(day,{weekday:'long',day:'numeric',month:'long'})}${isLeave(leavePerson,day)?', leave recorded':''}">${i+1}${isLeave(leavePerson,day)?'<span class="marker"></span>':''}</button>`}).join('')}</div><div class="selected-summary row between"><span id="selected-count" class="small muted">${selected.size?selected.size+' date'+(selected.size!==1?'s':'')+' selected':'Tap dates to select them'}</span><button class="btn small quiet" id="clear-selection">Clear</button></div><div class="row"><button class="btn primary" id="save-leave" data-mutate ${!selected.size?'disabled':''}>Record selected dates</button><button class="btn danger" id="cancel-selected" data-mutate ${!selected.size?'disabled':''}>Cancel selected</button></div><p class="hint-line">Blue dates already have leave recorded. A dot marks recorded leave.</p></div><details><summary class="small" style="cursor:pointer;font-weight:600">Select a date range</summary><div class="range-grid" style="margin-top:14px"><label class="field">From<input type="date" id="range-from"></label><label class="field">To<input type="date" id="range-to"></label><button class="btn" id="select-range">Select range</button></div><p class="hint-line">All dates in the range are selected, including rest days. Adjust the selection before saving.</p></details></section><section class="panel"><div class="row between panel-title"><h2>Upcoming leave</h2><span class="pill blue">${upcoming.length} dates</span></div><div class="leave-list">${upcoming.length?upcoming.map(x=>`<div class="leave-item"><div class="date-block"><div class="date-square">${parse(x.day).getUTCDate()}<small>${dateLabel(x.day,{month:'short'})}</small></div><div><strong>${dateLabel(x.day,{weekday:'long'})}</strong><div class="small muted">${dateLabel(x.day,{day:'numeric',month:'long',year:'numeric'})}</div></div></div><button class="btn small danger" data-cancel-day="${x.day}" data-mutate>Cancel</button></div>`).join(''):'<div class="empty"><strong>No upcoming leave</strong>Recorded dates will appear here.</div>'}</div></section></div>`;
 const move=n=>{const x=parse(first);x.setUTCMonth(x.getUTCMonth()+n);month=key(x).slice(0,7);myLeave()};$('#prev-month').onclick=()=>move(-1);$('#next-month').onclick=()=>move(1);if(user.isAdmin)$('#leave-person').onchange=e=>{leavePerson=e.target.value;selected.clear();myLeave()};
 document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const day=b.dataset.day;selected.has(day)?selected.delete(day):selected.add(day);myLeave()});$('#clear-selection').onclick=()=>{selected.clear();myLeave()};$('#save-leave').onclick=async()=>{if(await mutate('addLeave',{login:leavePerson,dates:[...selected]},'Leave recorded.')){selected.clear();myLeave()}};$('#cancel-selected').onclick=async()=>{if(!confirm('Cancel leave on the selected dates?'))return;if(await mutate('cancelLeave',{login:leavePerson,dates:[...selected]},'Leave cancelled.')){selected.clear();myLeave()}};document.querySelectorAll('[data-cancel-day]').forEach(b=>b.onclick=()=>{if(confirm('Cancel leave on '+dateLabel(b.dataset.cancelDay)+'?'))mutate('cancelLeave',{login:leavePerson,dates:[b.dataset.cancelDay]},'Leave cancelled.')});$('#select-range').onclick=()=>{const from=$('#range-from').value,to=$('#range-to').value;if(!from||!to||from>to){toast('Choose a valid date range.',true);return}const count=Math.round((parse(to)-parse(from))/86400000)+1;if(count>100){toast('Select up to 100 dates at a time.',true);return}for(let i=0;i<count;i++)selected.add(add(from,i));month=from.slice(0,7);myLeave()};

function assignments(){return draft||data.rota.filter(x=>x.day>=weekStart&&x.day<=add(weekStart,6)&&x.shift===shift)}
function rotaView(){const days=Array.from({length:7},(_,i)=>add(weekStart,i));const as=assignments();$('#workspace').innerHTML=`<div class="page-heading row between"><div><h1>Training rota</h1><p class="muted">Assignments by day, session and shift.</p></div><div class="row">${user.isAdmin?'<button class="btn" id="copy-week">Copy to next week</button>':''}<button class="btn" id="rota-csv">Export CSV</button></div></div><section class="panel">${weekControls()}<div class="row between" style="margin-top:20px"><div class="segments" aria-label="Shift">${Object.entries(SHIFTS).map(([k,v])=>`<button data-rota-shift="${k}" aria-pressed="${shift===k}">${v}</button>`).join('')}</div><span class="small muted">${draft?'Unsaved changes':as.length+' assignments'}</span></div><div class="rota-grid">${days.map(day=>`<section class="rota-day"><header class="rota-day-header"><strong>${dateLabel(day,{weekday:'long',day:'numeric',month:'short'})}</strong>${day===today()?'<span class="pill blue">Today</span>':''}</header>${SESSIONS.map(s=>{const assigned=as.filter(x=>x.day===day&&x.session===s.id);const eligibleLead=s.id!=='day2'||assigned.some(x=>['SM','PI'].includes(person(x.login)?.role));const short=(assigned.length<s.min||!eligibleLead)&&s.min>0;return `<div class="session-row"><div class="session-title"><strong>${s.name}</strong><div class="coverage ${short?'short':''}">${s.min?`${assigned.length}/${s.min} minimum${!eligibleLead?' · needs SM / PI':''}`:s.desc}</div></div><div class="assignments">${assigned.length?assigned.map(x=>`<span class="assignment">${esc(x.login)}${person(x.login)?.active?'':' · archived'}</span>`).join(''):'<span class="small muted">Unassigned</span>'}</div>${user.isAdmin?`<div class="row"><button class="btn small" data-assign="${s.id}" data-assign-day="${day}">Assign</button>${day>=today()?`<button class="btn small quiet" data-cover="${s.id}" data-cover-day="${day}">Cover</button>`:''}</div>`:''}</div>`}).join('')}</section>`).join('')}</div></section>${draft&&user.isAdmin?'<div class="fixed-action" style="margin-top:16px"><button class="btn" id="discard-rota">Discard changes</button><button class="btn primary" id="save-rota" data-mutate>Save rota</button></div>':''}`;
 bindWeek();document.querySelectorAll('[data-rota-shift]').forEach(b=>b.onclick=()=>{if(draft&&!confirm('Discard your unsaved rota changes?'))return;shift=b.dataset.rotaShift;draft=null;rotaView()});document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>assignModal(b.dataset.assign,b.dataset.assignDay));document.querySelectorAll('[data-cover]').forEach(b=>b.onclick=()=>coverModal(b.dataset.cover,b.dataset.coverDay));$('#rota-csv').onclick=()=>{const rows=[['Date','Shift','Session','Username'],...as.map(x=>[x.day,SHIFTS[shift],SESSIONS.find(s=>s.id===x.session)?.name||x.session,x.login])];download('LCY8-rota-'+weekStart+'-'+shift+'.csv',rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')};if(draft){$('#discard-rota').onclick=()=>{draft=null;rotaView()};$('#save-rota').onclick=()=>saveRota()};if(user.isAdmin)$('#copy-week').onclick=()=>copyWeek();

function eligible(p,s,day){return p.active&&s.roles.includes(p.role)&&!isLeave(p.login,day)&&((p.shift===shift&&isWorking(p,day))||data.vet.some(v=>v.day===day&&v.shift===shift&&v.sessionId===s.id&&v.confirmed.includes(p.login)))}
function assignModal(sessionId,day){const s=SESSIONS.find(x=>x.id===sessionId),current=assignments().filter(x=>x.day===day&&x.session===sessionId).map(x=>x.login);const candidates=activePeople().filter(p=>eligible(p,s,day)).sort((a,b)=>a.login.localeCompare(b.login));const ineligible=current.filter(login=>!candidates.some(p=>p.login===login));openModal('Assign · '+s.name,`<p class="muted small">${dateLabel(day,{weekday:'long',day:'numeric',month:'short'})} · ${SHIFTS[shift]}<br>${s.desc}</p>${ineligible.length?'<div class="notice" style="margin-top:14px">Some existing assignments are no longer eligible. They will be removed if you apply this selection.</div>':''}<div style="margin-top:10px">${candidates.length?candidates.map(p=>`<label class="candidate"><input type="checkbox" name="candidate" value="${esc(p.login)}" ${current.includes(p.login)?'checked':''}><span><strong>${esc(p.login)}</strong><br><span class="small muted">${ROLES[p.role]}</span></span></label>`).join(''):'<div class="empty"><strong>No eligible team members</strong>Check working days, roles and leave, or request cover.</div>'}</div>`,[{label:'Apply selection',primary:true,run:()=>{const choices=[...document.querySelectorAll('[name=candidate]:checked')].map(x=>x.value);if(!draft)draft=structuredClone(assignments());draft=draft.filter(x=>!(x.day===day&&x.session===sessionId));choices.forEach(login=>draft.push({week:weekInfo(weekStart).week,shift,session:sessionId,day,login}));closeModal();rotaView()}}])}
function version(start=weekStart){return data.versions.find(v=>v.start===start&&v.shift===shift)?.version||0}
async function saveRota(){await mutate('saveRota',{start:weekStart,week:weekInfo(weekStart).week,shift,assignments:draft,version:version()},'Rota saved.')}
async function copyWeek(){if(draft){toast('Save or discard the current rota changes first.',true);return}const start=add(weekStart,7);if(data.rota.some(x=>x.shift===shift&&x.day>=start&&x.day<=add(start,6))){toast('Next week already has assignments. Open it to edit them.',true);return}const source=assignments();if(!source.length){toast('There are no assignments to copy.',true);return}const copied=source.map(x=>({...x,day:add(x.day,7),week:weekInfo(start).week})).filter(x=>{const p=person(x.login);return p&&eligible(p,SESSIONS.find(s=>s.id===x.session),x.day)});if(!confirm('Copy '+copied.length+' eligible assignments to next week? '+(source.length-copied.length)+' will be skipped because of working days, roles or leave.'))return;if(await mutate('saveRota',{start,week:weekInfo(start).week,shift,assignments:copied,version:version(start)},'Next week’s rota saved.')){weekStart=start;rotaView()}}
function coverModal(sessionId='day1',day=today()){const s=SESSIONS.find(x=>x.id===sessionId);openModal('Request VET cover',`<div class="stack"><label class="field">Date<input type="date" id="cover-date" value="${day}" min="${today()}" required></label><label class="field">Shift<select id="cover-shift">${Object.entries(SHIFTS).map(([k,v])=>`<option value="${k}" ${shift===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Session<select id="cover-session">${SESSIONS.map(x=>`<option value="${x.id}" ${sessionId===x.id?'selected':''}>${x.name}</option>`).join('')}</select></label><label class="field">Who can respond?<select id="cover-role"></select></label><label class="field">People needed<input id="cover-needed" type="number" min="1" max="30" value="1"></label></div>`,[{label:'Create request',primary:true,run:async()=>{const id=$('#cover-session').value,d=$('#cover-date').value,minRole=$('#cover-role').value,needed=Number($('#cover-needed').value),sh=$('#cover-shift').value;if(!d||d<today()||!Number.isInteger(needed)||needed<1||needed>30){toast('Check the date and number of people.',true);return}if(await mutate('createVet',{day:d,week:weekInfo(sunday(d)).week,shift:sh,sessionId:id,minRole,needed},'Cover request created.'))closeModal()}}]);function roleOptions(){const id=$('#cover-session').value;const options=id==='proxy'?['SM']:['day1','aew'].includes(id)?['SM','PI']:['SM','PI','SME'];$('#cover-role').innerHTML=options.map(r=>`<option value="${r}">${r==='SM'?'SM only':r==='PI'?'SM and PI':'SM, PI and SME'}</option>`).join('')}roleOptions();$('#cover-session').onchange=roleOptions}
function vetView(){const requests=data.vet.filter(v=>vetFilter==='all'||(v.status==='open'&&v.day>=today())).sort((a,b)=>a.day.localeCompare(b.day));$('#workspace').innerHTML=`<div class="page-heading row between"><div><h1>VET cover</h1><p class="muted">Express interest in cover; a trainer confirms the assignment.</p></div>${user.isAdmin?'<button class="btn primary" id="create-cover">Request cover</button>':''}</div><div class="segments" style="margin-bottom:20px"><button data-vet-filter="open" aria-pressed="${vetFilter==='open'}">Open requests</button><button data-vet-filter="all" aria-pressed="${vetFilter==='all'}">All requests</button></div><div class="vet-list">${requests.length?requests.map(v=>{const mine=v.responders.includes(user.login),confirmed=v.confirmed.includes(user.login),p=person(user.login),roleEligible=p&&(v.minRole==='SM'?p.role==='SM':v.minRole==='PI'?['SM','PI'].includes(p.role):['SM','PI','SME'].includes(p.role));return `<article class="panel vet-card"><header><div><h2>${esc(v.sessionName)}</h2><p class="small muted">${dateLabel(v.day,{weekday:'long',day:'numeric',month:'long'})}</p></div><span class="pill ${v.status==='open'&&v.day>=today()?'green':''}">${v.day<today()?'Past':v.status==='open'?'Open':'Closed'}</span></header><div class="cover-meta"><span>${SHIFTS[v.shift]}</span><span>·</span><span>${v.minRole==='SM'?'SM only':v.minRole==='PI'?'SM / PI':'SM / PI / SME'}</span></div><div class="row between"><span class="small"><strong>${v.confirmed.length} / ${v.needed}</strong> confirmed</span><span class="small muted">${v.responders.length} interested</span></div>${user.isAdmin?`<div>${v.responders.length?v.responders.map(login=>`<div class="response-row"><span>${esc(login)}</span>${v.confirmed.includes(login)?'<span class="pill green">Confirmed</span>':v.day>=today()?`<button class="btn small" data-confirm-vet="${esc(v.id)}" data-vet-login="${esc(login)}" data-mutate>Confirm</button>`:'<span class="small muted">Not confirmed</span>'}</div>`).join(''):'<span class="small muted">No responses yet.</span>'}</div>${v.status==='open'?`<button class="btn quiet" data-close-vet="${esc(v.id)}" data-mutate>Close request</button>`:''}`:confirmed?'<div class="notice">You’re confirmed for this cover.</div>':mine?'<div class="notice">Your interest is recorded. Waiting for trainer confirmation.</div>':v.status==='open'&&v.day>=today()?`<button class="btn primary" data-respond-vet="${esc(v.id)}" data-mutate ${!roleEligible||isLeave(user.login,v.day)?'disabled':''}>${isLeave(user.login,v.day)?'You have leave on this date':!roleEligible?'Different role required':'Express interest'}</button>`:''}</article>`}).join(''):'<div class="panel empty" style="grid-column:1/-1"><strong>No open cover requests</strong>Available opportunities will appear here.</div>'}</div>`;document.querySelectorAll('[data-vet-filter]').forEach(b=>b.onclick=()=>{vetFilter=b.dataset.vetFilter;vetView()});if(user.isAdmin)$('#create-cover').onclick=()=>coverModal();document.querySelectorAll('[data-respond-vet]').forEach(b=>b.onclick=()=>mutate('respondVet',{id:b.dataset.respondVet},'Interest recorded.'));document.querySelectorAll('[data-close-vet]').forEach(b=>b.onclick=()=>{if(confirm('Close this cover request?'))mutate('closeVet',{id:b.dataset.closeVet},'Request closed.')});document.querySelectorAll('[data-confirm-vet]').forEach(b=>b.onclick=()=>mutate('confirmVet',{id:b.dataset.confirmVet,login:b.dataset.vetLogin},'Confirmed and added to the rota.'))}
function peopleView(){if(!user.isAdmin){view='overview';overview();return}$('#workspace').innerHTML=`<div class="page-heading row between"><div><h1>Team members</h1><p class="muted">Roles, shifts, working days and access.</p></div><button class="btn primary" id="add-person">Add person</button></div><section class="panel">${filtersHtml()}<div class="people-list" id="people-list"></div></section>`;function draw(){const list=members();$('#people-list').innerHTML=list.length?list.map(p=>`<article class="person-card panel" style="box-shadow:none"><div><div class="row"><strong>${esc(p.login)}</strong><span class="pill blue">${p.role}</span><span class="small muted">${SHIFTS[p.shift]||'No shift'}</span></div><div class="working-days">${p.availability.length?p.availability.join(' · '):'No working days set'}</div></div><div class="row"><button class="btn small" data-edit-person="${esc(p.login)}">Edit</button><button class="btn small" data-reset-person="${esc(p.login)}">Reset PIN</button><button class="btn small danger" data-archive-person="${esc(p.login)}" data-mutate>Archive</button></div></article>`).join(''):'<div class="empty"><strong>No matching people</strong></div>';document.querySelectorAll('[data-edit-person]').forEach(b=>b.onclick=()=>personModal(person(b.dataset.editPerson)));document.querySelectorAll('[data-reset-person]').forEach(b=>b.onclick=()=>resetPinModal(b.dataset.resetPerson));document.querySelectorAll('[data-archive-person]').forEach(b=>b.onclick=()=>{if(confirm('Archive '+b.dataset.archivePerson+'? Their history will be preserved and sign-in disabled.'))mutate('archivePerson',{login:b.dataset.archivePerson},'Person archived.')})}draw();bindFilters(draw);$('#add-person').onclick=()=>personModal()}
function personModal(p){openModal(p?'Edit '+p.login:'Add team member',`<div class="stack"><label class="field">Username<input id="person-login" value="${esc(p?.login||'')}" ${p?'readonly':''} autocapitalize="none" maxlength="64"></label><label class="field">Role<select id="person-role">${['SM','PI','SME'].map(r=>`<option ${p?.role===r?'selected':''}>${r}</option>`).join('')}</select></label><label class="field">Shift<select id="person-shift">${Object.entries(SHIFTS).map(([k,v])=>`<option value="${k}" ${p?.shift===k?'selected':''}>${v}</option>`).join('')}</select></label><div><span class="field" style="margin-bottom:8px">Working days</span><div class="day-checkboxes">${DAY.map(d=>`<label class="check-label"><input name="person-day" type="checkbox" value="${d}" ${p?.availability.includes(d)?'checked':''}>${d}</label>`).join('')}</div></div>${!p?'<label class="field">Initial PIN<input id="person-pin" type="password" inputmode="numeric" minlength="6" maxlength="12" autocomplete="new-password"></label><p class="small muted">Give this code to the person. They must change it on first sign-in.</p>':''}</div>`,[{label:'Save person',primary:true,run:async()=>{const values={login:$('#person-login').value.trim(),role:$('#person-role').value,shift:$('#person-shift').value,availability:[...document.querySelectorAll('[name=person-day]:checked')].map(x=>x.value),pin:$('#person-pin')?.value||''};if(await mutate('savePerson',values,'Team member saved.'))closeModal()}}])}
function resetPinModal(login){openModal('Reset PIN · '+login,`<div class="stack"><p class="muted small">Choose an initial access code and give it to this person. They must change it next time they sign in.</p><label class="field">Initial PIN · 6 to 12 digits<input id="reset-pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12"></label></div>`,[{label:'Reset PIN',primary:true,run:async()=>{if(await mutate('resetPin',{login,pin:$('#reset-pin').value},'PIN reset. Existing sessions have been signed out.'))closeModal()}}])}
function openModal(title,body,actions){returnFocus=document.activeElement;const m=$('#modal');m.hidden=false;m.className='modal-backdrop';m.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title">${esc(title)}</h2><button class="btn icon" id="close-modal" aria-label="Close dialog">×</button></header>${body}<div class="footer"><button class="btn" id="cancel-modal">Cancel</button>${actions.map((a,i)=>`<button class="btn ${a.primary?'primary':''}" data-modal-action="${i}" data-mutate>${esc(a.label)}</button>`).join('')}</div></section>`;$('#close-modal').onclick=closeModal;$('#cancel-modal').onclick=closeModal;m.onclick=e=>{if(e.target===m)closeModal()};document.querySelectorAll('[data-modal-action]').forEach(b=>b.onclick=()=>actions[Number(b.dataset.modalAction)].run());m.querySelector('input,select,button')?.focus()}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';m.className='';returnFocus?.isConnected&&returnFocus.focus();returnFocus=null}
document.addEventListener('keydown',e=>{if($('#modal').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const list=[...$('#modal').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),a[href]')];const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
let demoData=null;
function sample(){const start=sunday(today());return {ok:true,user:{login:'trainer',isAdmin:true},people:[{login:'alex.s',role:'SM',shift:'DAYS',availability:['Sun','Mon','Tue','Wed'],active:true},{login:'jamie.r',role:'PI',shift:'DAYS',availability:['Wed','Thu','Fri','Sat'],active:true},{login:'charlie.m',role:'SME',shift:'DAYS',availability:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],active:true},{login:'taylor.k',role:'SM',shift:'DAYS',availability:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],active:true},{login:'morgan.p',role:'SM',shift:'TWI',availability:['Sun','Mon','Tue','Wed'],active:true},{login:'casey.d',role:'SME',shift:'NIGHTS',availability:['Wed','Thu','Fri','Sat'],active:true}],leave:[{login:'alex.s',day:add(start,2)},{login:'alex.s',day:add(start,3)},{login:'jamie.r',day:add(start,5)}],rota:[{week:weekInfo(start).week,shift:'DAYS',session:'day1',day:add(start,4),login:'jamie.r'},{week:weekInfo(start).week,shift:'DAYS',session:'day1',day:add(start,4),login:'taylor.k'},{week:weekInfo(start).week,shift:'DAYS',session:'day2',day:add(start,4),login:'charlie.m'}],vet:[{id:'demo-1',week:weekInfo(start).week,shift:'DAYS',sessionId:'aew',sessionName:'AEW',day:add(today(),2),minRole:'PI',needed:1,responders:['taylor.k'],confirmed:[],status:'open'}],versions:[]}}
async function demoApi(action,args){if(!demoData)demoData=sample();if(action==='snapshot'||action==='export')return structuredClone(demoData);if(action==='addLeave'){for(const day of args.dates)if(!demoData.leave.some(x=>x.day===day&&x.login===args.login))demoData.leave.push({login:args.login,day})}else if(action==='cancelLeave'){demoData.leave=demoData.leave.filter(x=>!(x.login===args.login&&args.dates.includes(x.day)))}else if(action==='saveRota'){demoData.rota=demoData.rota.filter(x=>!(x.shift===args.shift&&x.day>=args.start&&x.day<=add(args.start,6))).concat(args.assignments.map(x=>({...x,shift:args.shift,week:args.week})));demoData.versions=demoData.versions.filter(x=>!(x.start===args.start&&x.shift===args.shift)).concat({start:args.start,shift:args.shift,version:args.version+1})}else if(action==='closeVet'){demoData.vet.find(x=>x.id===args.id).status='closed'}else if(action==='confirmVet'){const v=demoData.vet.find(x=>x.id===args.id);if(!v.confirmed.includes(args.login)){v.confirmed.push(args.login);demoData.rota.push({week:v.week,shift:v.shift,session:v.sessionId,day:v.day,login:args.login});if(v.confirmed.length>=v.needed)v.status='closed'}}else if(action==='createVet'){demoData.vet.push({...args,id:'demo-'+Date.now(),sessionName:SESSIONS.find(s=>s.id===args.sessionId).name,responders:[],confirmed:[],status:'open'})}else if(action==='savePerson'){const p=demoData.people.find(x=>x.login===args.login);const clean={login:args.login,role:args.role,shift:args.shift,availability:args.availability,active:true};p?Object.assign(p,clean):demoData.people.push(clean)}else if(action==='archivePerson'){demoData.people.find(x=>x.login===args.login).active=false}else if(action==='changePin'||action==='resetPin'){toast('Sample mode: no live PIN changed.')}return {ok:true}}
async function init(){if(demo){user={login:'trainer',isAdmin:true};await reload();return}if(!token){loginScreen();return}try{await reload()}catch(e){if(e.message.includes('Set your own PIN')){user={login:'your account'};pinScreen()}else{loginScreen();toast(e.message,true)}}}
window.addEventListener('beforeunload',e=>{if(draft){e.preventDefault();e.returnValue=''}});
init();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
